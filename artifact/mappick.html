<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mappick CS2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg:#eef1f4; --surface:#ffffff; --surface-2:#e4e9ee; --sunken:#dde3e9;
    --line:#ccd5dd; --line-soft:#dfe5eb;
    --fg:#141d27; --fg-dim:#54677a; --fg-faint:#8394a3;
    --accent:#2f6fb5; --accent-soft:#dce8f5;
    --good:#2c8a4e; --mid:#b57b16; --bad:#c03f38;
    --shadow:0 1px 2px rgba(20,29,39,.07), 0 4px 14px rgba(20,29,39,.05);
    --mono:"Barlow",ui-monospace,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0d1218; --surface:#151d26; --surface-2:#1c2531; --sunken:#0a0e13;
      --line:#2a3541; --line-soft:#222c37;
      --fg:#e3ebf2; --fg-dim:#94a5b4; --fg-faint:#64757f;
      --accent:#5b9be0; --accent-soft:#1a2c40;
      --good:#3fb562; --mid:#d9a441; --bad:#e0574f;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --bg:#0d1218; --surface:#151d26; --surface-2:#1c2531; --sunken:#0a0e13;
    --line:#2a3541; --line-soft:#222c37;
    --fg:#e3ebf2; --fg-dim:#94a5b4; --fg-faint:#64757f;
    --accent:#5b9be0; --accent-soft:#1a2c40;
    --good:#3fb562; --mid:#d9a441; --bad:#e0574f;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
  }

  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--fg);
    font-family:"Barlow",system-ui,-apple-system,sans-serif;
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:940px; margin:0 auto; padding-inline:16px; padding-block:22px 56px; }

  /* ---------------------------------------------------------- cabecalho */
  header { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:20px; }
  h1 {
    font-family:"Barlow Condensed",system-ui,sans-serif; font-weight:700;
    font-size:30px; letter-spacing:.4px; text-transform:uppercase; margin:0; line-height:1;
  }
  .sub { color:var(--fg-faint); font-size:13px; margin-top:4px; }
  .meta { display:flex; gap:20px; flex-wrap:wrap; }
  .meta div { text-align:right; }
  .meta .k {
    font-family:"Barlow Condensed",sans-serif; font-size:11px; letter-spacing:.8px;
    text-transform:uppercase; color:var(--fg-faint); font-weight:600;
  }
  .meta .v { font-size:17px; font-weight:600; font-variant-numeric:tabular-nums; }

  /* ------------------------------------------------------------- painel */
  .panel { background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); }
  .panel + .panel { margin-top:14px; }
  .phead {
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    padding:13px 16px; border-bottom:1px solid var(--line-soft);
  }
  h2 {
    font-family:"Barlow Condensed",sans-serif; font-weight:600; font-size:14px;
    letter-spacing:1px; text-transform:uppercase; margin:0; color:var(--fg-dim);
  }
  .pbody { padding:14px 16px; }

  /* -------------------------------------------------------------- lobby */
  .mates { display:flex; flex-wrap:wrap; gap:8px; }
  .mate {
    display:inline-flex; align-items:center; gap:8px; cursor:pointer; user-select:none;
    background:var(--surface-2); border:1px solid var(--line); border-radius:7px;
    padding:7px 12px; transition:background .12s, border-color .12s;
  }
  .mate:hover { border-color:var(--fg-faint); }
  .mate:focus-within { outline:2px solid var(--accent); outline-offset:2px; }
  .mate input { accent-color:var(--accent); margin:0; cursor:pointer; }
  .mate.on { background:var(--accent-soft); border-color:var(--accent); }
  .mate .nm { font-weight:600; font-size:14px; }
  .mate .gm { font-size:11px; color:var(--fg-faint); font-variant-numeric:tabular-nums; }
  .you {
    display:inline-flex; align-items:center; gap:8px; padding:7px 12px;
    border:1px dashed var(--line); border-radius:7px; color:var(--fg-dim); font-size:14px;
  }

  .peso { margin-top:14px; padding-top:12px; border-top:1px solid var(--line-soft);
          font-size:12px; color:var(--fg-dim); line-height:1.65; }
  .peso b { color:var(--fg); font-variant-numeric:tabular-nums; }
  .season { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:14px;
            padding-top:12px; border-top:1px solid var(--line-soft); }
  .seg-l { font-family:"Barlow Condensed",sans-serif; font-size:11px; letter-spacing:.8px;
           text-transform:uppercase; color:var(--fg-faint); font-weight:600; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; flex-wrap:wrap; }
  .seg button { font-family:inherit; font-size:12px; padding:5px 11px; border:0; cursor:pointer;
                background:var(--surface-2); color:var(--fg-dim); border-right:1px solid var(--line);
                font-variant-numeric:tabular-nums; }
  .seg button:last-child { border-right:0; }
  .seg button:hover { color:var(--fg); }
  .seg button:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
  .seg button[aria-pressed="true"] { background:var(--accent); color:#fff; font-weight:600; }

  /* ------------------------------------------------------------ ranking */
  .rows { display:flex; flex-direction:column; }
  .row {
    display:grid; grid-template-columns:22px 104px 1fr 58px 150px;
    align-items:center; gap:12px; padding:10px 16px; cursor:pointer;
    border-bottom:1px solid var(--line-soft); background:none; border-left:0; border-right:0; border-top:0;
    width:100%; text-align:left; font:inherit; color:inherit;
  }
  .row:last-of-type { border-bottom:0; }
  .row:hover { background:var(--surface-2); }
  .row:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
  .row.top { background:linear-gradient(90deg,var(--accent-soft),transparent 60%); }
  .pos { font-family:"Barlow Condensed",sans-serif; font-weight:600; font-size:15px;
         color:var(--fg-faint); text-align:right; font-variant-numeric:tabular-nums; }
  .row.top .pos { color:var(--accent); }
  .mp { font-family:"Barlow Condensed",sans-serif; font-weight:600; font-size:17px; letter-spacing:.3px; }

  .bar { position:relative; height:20px; background:var(--sunken); border-radius:4px; overflow:hidden; }
  .fill { position:absolute; inset:0 auto 0 0; border-radius:4px; transition:width .3s cubic-bezier(.2,.8,.2,1); }
  .ci { position:absolute; top:50%; transform:translateY(-50%); height:10px;
        border-left:2px solid var(--fg-dim); border-right:2px solid var(--fg-dim);
        transition:left .3s, width .3s; }
  .ci::before { content:""; position:absolute; top:50%; left:0; right:0; height:1px;
                transform:translateY(-50%); background:var(--fg-dim); opacity:.6; }
  .mid50 { position:absolute; top:0; bottom:0; left:50%; width:0; border-left:1px dashed var(--fg-faint); opacity:.55; }

  .pct { text-align:right; font-weight:700; font-size:16px; font-variant-numeric:tabular-nums; }
  .side { display:flex; flex-direction:column; align-items:flex-end; gap:2px; }
  .conf { font-size:10px; letter-spacing:.5px; text-transform:uppercase; font-weight:600;
          padding:1px 7px; border-radius:3px; font-family:"Barlow Condensed",sans-serif; }
  .c-alta{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good);}
  .c-media{background:color-mix(in srgb,var(--mid) 18%,transparent);color:var(--mid);}
  .c-baixa{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad);}
  .c-sem{background:var(--surface-2);color:var(--fg-faint);}
  .nn { font-size:10px; color:var(--fg-faint); font-variant-numeric:tabular-nums; }

  /* ------------------------------------------------------------ detalhe */
  .det { padding:2px 16px 18px 16px; background:var(--surface-2); border-bottom:1px solid var(--line-soft); }
  .dgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:18px; padding-top:14px; }
  .dgrid h3 {
    font-family:"Barlow Condensed",sans-serif; font-size:11px; letter-spacing:.9px;
    text-transform:uppercase; color:var(--fg-faint); margin:0 0 7px; font-weight:600;
  }
  .kv { display:flex; justify-content:space-between; gap:12px; font-size:13px; color:var(--fg-dim); padding:2px 0; }
  .kv b { color:var(--fg); font-weight:600; font-variant-numeric:tabular-nums; }
  .kv.sum { border-top:1px solid var(--line); margin-top:4px; padding-top:5px; }
  .kv.sum b { color:var(--accent); }
  .note { font-size:13px; color:var(--fg-dim); line-height:1.6; }
  .note b { color:var(--fg); }

  .banner {
    display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
    padding:11px 16px; border-top:1px solid var(--line-soft); background:var(--surface-2);
    border-radius:0 0 10px 10px; font-size:13px; color:var(--fg-dim);
  }
  .banner .lab { font-family:"Barlow Condensed",sans-serif; font-size:11px; letter-spacing:.8px;
                 text-transform:uppercase; color:var(--fg-faint); font-weight:600; }
  .banner .mapx { font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:16px; color:var(--bad); }

  .verdict { padding:13px 16px; border-left:3px solid var(--mid); }
  .verdict.ok { border-left-color:var(--good); }
  .verdict .vt {
    font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:16px;
    letter-spacing:.4px; text-transform:uppercase; color:var(--mid); margin-bottom:3px;
  }
  .verdict.ok .vt { color:var(--good); }
  .verdict .vb { font-size:13px; color:var(--fg-dim); line-height:1.6; max-width:68ch; }
  .verdict .vb b { color:var(--fg); }

  .vazio { padding:22px 16px; color:var(--fg-dim); font-size:14px; }
  .up { color:var(--good); } .dn { color:var(--bad); }

  /* ------------------------------------------------ tabela de relevancia */
  .tscroll { overflow-x:auto; }
  table.rel { width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums; }
  .rel th { text-align:left; font-family:"Barlow Condensed",sans-serif; font-size:11px; letter-spacing:.7px;
            text-transform:uppercase; color:var(--fg-faint); font-weight:600; padding:8px 10px;
            border-bottom:1px solid var(--line); white-space:nowrap; }
  .rel td { padding:6px 10px; border-bottom:1px solid var(--line-soft); color:var(--fg-dim); white-space:nowrap; }
  .rel tr:last-child td { border-bottom:0; }
  .rel td.r, .rel th.r { text-align:right; }
  .rel .res { font-weight:700; }
  .rel .res.v { color:var(--good); } .rel .res.d { color:var(--bad); }
  .rel .mpn { color:var(--fg); font-weight:600; }
  .relv { display:flex; align-items:center; gap:8px; justify-content:flex-end; }
  .relv b { color:var(--fg); min-width:48px; text-align:right; }
  .relbar { width:70px; height:6px; background:var(--sunken); border-radius:3px; overflow:hidden; }
  .relbar i { display:block; height:100%; background:var(--accent); }
  .tfoot { display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:10px 16px;
           border-top:1px solid var(--line-soft); font-size:12px; color:var(--fg-faint); }
  .tfoot b { color:var(--fg); }
  .tfoot button, .phead select { font:inherit; font-size:12px; padding:4px 10px; border-radius:6px; cursor:pointer;
           border:1px solid var(--line); background:var(--surface-2); color:var(--fg-dim); }
  @media (max-width:640px) { .rel .hm { display:none; } .relbar { width:40px; } .rel td, .rel th { padding-inline:6px; } }

  footer { margin-top:18px; font-size:12px; color:var(--fg-faint); line-height:1.7; }
  footer code { background:var(--surface-2); padding:1px 5px; border-radius:3px; font-family:var(--mono); }

  @media (max-width:640px) {
    .row { grid-template-columns:20px 82px 1fr 52px; gap:9px; padding-inline:12px; }
    .side { display:none; }
    .meta { gap:14px; }
    h1 { font-size:25px; }
  }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Mappick</h1>
      <div class="sub" id="sub">—</div>
    </div>
    <div class="meta">
      <div><div class="k">Partidas</div><div class="v" id="m-n">—</div></div>
      <div><div class="k">Vitórias</div><div class="v" id="m-wl">—</div></div>
      <div><div class="k">Base geral</div><div class="v" id="m-base">—</div></div>
    </div>
  </header>

  <section class="panel">
    <div class="phead">
      <h2>Quem está no lobby</h2>
      <span class="nn" id="lobby-n"></span>
    </div>
    <div class="pbody">
      <div class="mates" id="mates"></div>
      <div class="season">
        <span class="seg-l">Season do Premier</span>
        <div class="seg" id="seg-season" role="group" aria-label="Filtrar por season do Premier"></div>
        <span class="nn" id="season-info"></span>
      </div>
      <div class="peso" id="peso"></div>
    </div>
  </section>

  <div id="verdict"></div>

  <section class="panel">
    <div class="phead">
      <h2>Ordem de pick</h2>
      <span class="nn">barra = % esperada · marcas = intervalo 90%</span>
    </div>
    <div class="rows" id="rows"></div>
    <div class="banner" id="ban"></div>
  </section>

  <section class="panel" style="margin-top:14px">
    <div class="phead">
      <h2>Detalhamento do cálculo</h2>
      <select id="tmap" aria-label="Filtrar por mapa"></select>
    </div>
    <div class="pbody note" id="tlead" style="padding-bottom:4px"></div>
    <div class="tscroll"><table class="rel" id="tbl"></table></div>
    <div class="tfoot" id="tfoot"></div>
  </section>

  <footer id="foot"></footer>
</div>

/* ------------------------------------------------- regras fixas do modelo
   Nada aqui e escolha de quem usa a pagina:
   - so Premier (no Competitivo o mapa vem da fila, sem veto)
   - peso por idade LINEAR na ordem das partidas: a mais antiga do lobby vale

const P = {

/* ------------------------------------------------------------ matematica */
const logit = p => { p = Math.min(Math.max(p,1e-6),1-1e-6); return Math.log(p/(1-p)); };
const kish = ws => { const a=ws.reduce((s,w)=>s+w,0), b=ws.reduce((s,w)=>s+w*w,0);
                     return b > 1e-12 ? a*a/b : 0; };
const shrink = (mean,n,prior,k) => (mean==null || n <= 1e-9) ? prior : (n*mean + k*prior)/(n+k);
function wmean(pairs){ let num=0,den=0; for(const [v,w] of pairs){ if(v==null||w==null) continue;
  num+=v*w; den+=w; } return den>1e-12 ? num/den : null; }
const clamp = (x,a,b) => Math.min(Math.max(x,a),b);

/* Seasons do Premier. Inicio = reset do CS Rating (datas publicadas, conferidas

const seasonOf = ts => { let n = SEASONS[0].n; for(const s of SEASONS) if(ts >= s.t0) n = s.n; return n; };

/* Nivel de cada jogador NA EPOCA de cada partida: media do indice dele nas 50
   partidas de Premier anteriores (minimo 10). O nivel muda muito com o tempo
   (KICK subiu ~10 pontos, voce caiu ~8); comparar com a media de sempre
   confundiria "mapa" com "epoca": o mapa mais jogado quando alguem era pior
   levaria a culpa. Nao depende do lobby nem do filtro de season. */
(function(){
  const hist = PLAYERS.map(() => []);
  for(const r of ROWS){
    r.lb = new Array(PLAYERS.length).fill(null);
    if(!r.premier) continue;
    for(let i=0;i<PLAYERS.length;i++){
      const v = r.perf[i]; if(v == null) continue;
      const h = hist[i];
      if(h.length >= 10){ const xs = h.slice(-P.trail); r.lb[i] = xs.reduce((s,x)=>s+x,0)/xs.length; }
      h.push(v);
    }
  }
})();

PLAYERS.forEach((p,i) => {
  const mine = ROWS.filter(r => r.premier && r.teams[i] !== "-");
  p.jogos = { 0: mine.length };                     // 0 = todas as seasons
  for(const s of SEASONS) p.jogos[s.n] = mine.filter(r => r.season === s.n).length;

/* Orienta a partida para o lado de quem esta no lobby. Devolve null quando
   ninguem do lobby jogou, ou quando o lobby ficou dividido entre os dois times. */
function orient(r, lobby){
  let side = null;
  for(let i=0;i<PLAYERS.length;i++){
    const ch = r.teams[i];
    if(ch === "-" || !lobby.has(PLAYERS[i].id)) continue;
    if(side && side !== ch) return null;
    side = ch;
  }
  if(!side) return null;
  const roster = new Set(), perfL = [];
  for(let i=0;i<PLAYERS.length;i++){
    if(r.teams[i] !== side) continue;
    roster.add(PLAYERS[i].id);
    if(lobby.has(PLAYERS[i].id) && r.perf[i] != null) perfL.push([i, r.perf[i]]);
  }
  return { rw: side==="1"?r.a:r.b, rl: side==="1"?r.b:r.a, roster, perfL };
}

function rosterWeight(roster, lobby){
  let inter = 0; for(const x of roster) if(lobby.has(x)) inter++;
  const uni = new Set([...roster,...lobby]).size;
  const j = uni ? inter/uni : 1;
  return P.rosterFloor + (1-P.rosterFloor) * Math.pow(j, P.rosterGamma);
}

function build(lobby, seasons = S.seasons){
  const ms = [];
  for(const r of ROWS){                      // ROWS ja esta em ordem cronologica
    if(!r.premier) continue;
    if(seasons.size && !seasons.has(r.season)) continue;
    const o = orient(r, lobby);
    if(!o) continue;
    const tot = o.rw + o.rl;
    ms.push({ ...r, rw:o.rw, rl:o.rl, roster:o.roster, perfL:o.perfL,
      outcome: o.rw>o.rl ? 1 : (o.rl>o.rw ? 0 : 0.5),
      roundShare: tot>0 ? o.rw/tot : 0.5,
      wLine: rosterWeight(o.roster, lobby) });
  }
  // peso linear: 1a partida 0%, ultima 100%, o resto dividido em partes iguais
  const n = ms.length;
  ms.forEach((m,i) => { m.wIdade = n > 1 ? i/(n-1) : 1; m.w = m.wIdade * m.wLine; });

  // alvo continuo (vitoria + saldo de rounds), recalibrado para a escala de vitoria
  for(const m of ms) m.q = P.wOutcome*m.outcome + P.wRoundShare*m.roundShare;
  const q1 = wmean(ms.filter(m=>m.outcome===1).map(m=>[m.q,m.wIdade]));
  const q0 = wmean(ms.filter(m=>m.outcome===0).map(m=>[m.q,m.wIdade]));
  if(q1!=null && q0!=null && (q1-q0) > 0.05)
    for(const m of ms) m.q = clamp((m.q-q0)/(q1-q0), -0.2, 1.2);

  // desempenho: cada jogador contra o proprio nivel na epoca (r.lb), assim quem
  // joga sempre bem nao puxa para cima os mapas que joga mais, e quem melhorou
  // ou piorou com o tempo nao joga a culpa nos mapas de cada fase
  for(const m of ms){
    const ds = m.perfL.filter(([i]) => m.lb[i] != null).map(([i,v]) => v - m.lb[i]);
    m.D = ds.length ? ds.reduce((s,x)=>s+x,0)/ds.length : null;
  }
  return ms;
}

function activeMaps(ms){
  const rec={}, all={}, tLast = ms.length ? ms[ms.length-1].ts : NOW;
  for(const m of ms){ all[m.map]=(all[m.map]||0)+1;
    if((tLast - m.ts)/86400 <= P.poolWindow) rec[m.map]=(rec[m.map]||0)+1; }
  // com season marcada: todos os mapas que o lobby jogou nela
  const pool = S.seasons.size ? all : (Object.keys(rec).length ? rec : all);
  return Object.keys(pool).sort((a,b)=>pool[b]-pool[a]);
}

function rank(lobbyIds){
  const lobby = new Set(lobbyIds);
  if(!lobby.size) return { maps:[], thetaG:0.5, total:0, ms:[], lobby };
  const ms = build(lobby);
  if(!ms.length) return { maps:[], thetaG:0.5, total:0, ms, lobby };

  const thetaG = shrink(wmean(ms.map(m=>[m.q,m.wIdade])), kish(ms.map(m=>m.wIdade)), 0.5, P.kGlobal);

  /* Quanto 1 ponto de desempenho acima da media vale em resultado, medido no
     proprio historico do lobby (regressao ponderada). E o que transforma o
     K/D de um mapa em % de vitoria, sem numero escolhido a mao. */
  let slope = 0;
  const ref = S.seasons.size ? build(lobby, new Set()) : ms;
  const dd = ref.filter(m => m.D != null && m.wIdade > 0);
  if(dd.length > 20){
    const sw = dd.reduce((s,m)=>s+m.wIdade,0);
    const mx = dd.reduce((s,m)=>s+m.D*m.wIdade,0)/sw, my = dd.reduce((s,m)=>s+m.q*m.wIdade,0)/sw;
    const vx = dd.reduce((s,m)=>s+m.wIdade*(m.D-mx)**2,0)/sw;
    const cxy = dd.reduce((s,m)=>s+m.wIdade*(m.D-mx)*(m.q-my),0)/sw;
    slope = vx > 1e-9 ? Math.max(cxy/vx, 0) : 0;
  }

  const out = activeMaps(ms).map(mp => {
    const onMap = ms.filter(m=>m.map===mp);
    const thetaM = shrink(wmean(onMap.map(m=>[m.q,m.wIdade])), kish(onMap.map(m=>m.wIdade)), thetaG, P.kMap);
    const n3 = kish(onMap.map(m=>m.w));
    const thetaR = shrink(wmean(onMap.map(m=>[m.q,m.w])), n3, thetaM, P.kRoster);

    const dv = onMap.filter(m=>m.D!=null).map(m=>[m.D, m.w]);
    const zn = kish(dv.map(([,w])=>w));
    const Zraw = wmean(dv);
    const Z = Zraw==null ? 0 : Zraw * zn/(zn + P.kPerf);
    const pKD = clamp(thetaG + slope*Z, 0.01, 0.99);

    const p = (1-P.kdShare)*thetaR + P.kdShare*pKD;
    const se = n3 > 1e-9 ? Math.sqrt(Math.max(p*(1-p),1e-6)/n3) : 0.5;
    const exact = onMap.filter(m =>
      m.roster.size===lobby.size && [...lobby].every(x=>m.roster.has(x)));
    const wins = onMap.filter(m=>m.outcome===1), losses = onMap.filter(m=>m.outcome===0);

    return {
      map:mp, p, low:Math.max(0,p-P.z*se), high:Math.min(1,p+P.z*se),
      nEff:n3, games:onMap.length,
      exW:exact.filter(m=>m.outcome===1).length,
      exL:exact.filter(m=>m.outcome===0).length,
      conf: n3<3?"sem dados":n3<8?"baixa":n3<20?"media":"alta",
      thetaG, thetaM, thetaR, pKD, Z, Zraw, slope,
      winW: wmean(onMap.map(m=>[m.outcome,m.w])),
      wTot: wins.length, lTot: losses.length,
    };
  });

  out.sort((a,b)=> b.p-a.p || b.nEff-a.nEff);
  return { maps:out, thetaG, slope, total:ms.length, sig: mapSignificance(ms, 40), ms, lobby };
}

/* ------------------------------------------------- teste de significancia
   As diferencas entre mapas sao maiores do que o acaso produziria? Testado
   sobre os ROUNDS, nao sobre vitorias, porque e onde o sinal apareceria
   primeiro se existisse. Qui-quadrado com p pela aproximacao de
   Wilson-Hilferty. */
function chiPValue(chi, df){
  if(df <= 0) return 1;
  const x = chi/df, z = (Math.pow(x,1/3) - (1 - 2/(9*df))) / Math.sqrt(2/(9*df));
  return 1 - normCdf(z);
}
function normCdf(z){
  const t = 1/(1+0.2316419*Math.abs(z));
  const d = 0.3989423*Math.exp(-z*z/2);
  const p = d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));
  return z > 0 ? 1-p : p;
}
function mapSignificance(rows, minN){
  minN = minN || 1;
  const by = {};
  for(const m of rows){
    const b = by[m.map] || (by[m.map] = [0,0,0]);
    b[0]+=m.rw; b[1]+=m.rl; b[2]++;     // ja orientados para o lado do lobby
  }
  const keys = Object.keys(by).filter(k => by[k][2] >= minN);
  const tw = keys.reduce((s,k)=>s+by[k][0],0), tl = keys.reduce((s,k)=>s+by[k][1],0);
  const base = tw/(tw+tl);
  let chi = 0;
  for(const k of keys){
    const [w,l] = by[k], r = w+l, e = r*base;
    if(e < 1 || r-e < 1) continue;
    chi += (w-e)**2/e + (l-(r-e))**2/(r-e);
  }
  const df = keys.length - 1;
  return { chi, df, p: chiPValue(chi, df), rounds: tw+tl, base };
}

/* ------------------------------------------------------------------ UI */
const S = { sel:new Set(), open:null, tmap:"", tall:false, seasons:new Set() };   // seasons vazio = todas
const $ = s => document.querySelector(s);
const pretty = m => m.replace(/^(de|cs)_/,"").replace(/^./,c=>c.toUpperCase());
const pc = x => (x*100).toFixed(1)+"%";
const sg = (x,d=1) => (x>=0?"+":"−") + Math.abs(x).toFixed(d);
const fdata = ts => new Date(ts*1000).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"2-digit"});

function colorFor(p){
  const t = Math.max(0, Math.min(1, (p-0.35)/0.35));
  const stops = [[192,63,56],[181,123,22],[44,138,78]];
  const dark = matchMedia("(prefers-color-scheme: dark)").matches
            && document.documentElement.getAttribute("data-theme") !== "light"
            || document.documentElement.getAttribute("data-theme") === "dark";
  const st = dark ? [[224,87,79],[217,164,65],[63,181,98]] : stops;
  const i = t<0.5?0:1, k = t<0.5?t*2:(t-0.5)*2;
  return "rgb(" + st[i].map((v,j)=>Math.round(v+(st[i+1][j]-v)*k)).join(",") + ")";
}

/* Os chips sao montados UMA vez. Recria-los a cada recalculo perderia o foco
   do teclado e deixaria um clique rapido cair num elemento ja substituido. */
function buildMates(){
  const box = $("#mates");
  box.innerHTML = "";
  for(const p of PLAYERS){
    const l = document.createElement("label");
    l.className = "mate" + (S.sel.has(p.id) ? " on" : "");
    l.dataset.id = p.id;
    l.innerHTML = `<input type="checkbox" autocomplete="off" id="m-${p.id}" ${S.sel.has(p.id)?"checked":""}>
      <span class="nm">${p.id===EU ? "◈ " : ""}${p.nome}</span><span class="gm">${jogosSel(p)}j</span>`;
    l.querySelector("input").addEventListener("change", e => {
      e.target.checked ? S.sel.add(p.id) : S.sel.delete(p.id);
      l.classList.toggle("on", e.target.checked);
      draw();
    });
    box.appendChild(l);
  }
}

const jogosSel = p => S.seasons.size ? [...S.seasons].reduce((s,n) => s + p.jogos[n], 0) : p.jogos[0];
function updateCounts(){
  for(const p of PLAYERS){
    const g = document.querySelector(`.mate[data-id="${p.id}"] .gm`);
    if(g) g.textContent = jogosSel(p) + "j";
  }
}
/* "Season 5", "Seasons 4 e 5", "Seasons 2, 4 e 5" */
function seasonLabel(){
  const ns = [...S.seasons].sort((a,b)=>a-b);
  if(!ns.length) return "";
  if(ns.length === 1) return "Season " + ns[0];
  return "Seasons " + ns.slice(0,-1).join(", ") + " e " + ns[ns.length-1];
}
// datas das seasons sao meia-noite UTC; em horario de Brasilia cairiam no dia anterior
const fdataUTC = ts => new Date(ts*1000).toLocaleDateString("pt-BR",
  {day:"2-digit",month:"2-digit",year:"2-digit",timeZone:"UTC"});
const seasonRange = s => `${fdataUTC(s.t0)} – ${s.t1===Infinity ? "hoje" : fdataUTC(s.t1 - 86400)}`;
function buildSeasons(){
  const box = $("#seg-season");
  const opts = [{ n:0, lab:"Todas", title:"Todas as seasons" }].concat(SEASONS.map(s => ({
    n:s.n, lab:"S"+s.n + (s.t1===Infinity ? " · atual" : ""), title:`Season ${s.n}: ${seasonRange(s)}` })));
  box.innerHTML = opts.map(o => `<button type="button" data-s="${o.n}" title="${o.title}"
    aria-pressed="false">${o.lab}</button>`).join("");
  const sync = () => [...box.children].forEach(x => {
    const n = +x.dataset.s;
    x.setAttribute("aria-pressed", String(n === 0 ? S.seasons.size === 0 : S.seasons.has(n)));
  });
  sync();
  box.addEventListener("click", e => {
    const b = e.target.closest("button"); if(!b) return;
    const n = +b.dataset.s;
    if(n === 0) S.seasons.clear();
    else S.seasons.has(n) ? S.seasons.delete(n) : S.seasons.add(n);
    if(S.seasons.size === SEASONS.length) S.seasons.clear();   // todas marcadas = Todas
    S.open = null; S.tmap = ""; S.tall = false;
    sync();
    updateCounts();
    draw();
  });
}

/* peso de cada partida pela idade, em numeros, para o lobby marcado */
function drawPeso(r){
  const ms = r.ms || [], n = ms.length;
  if(n < 2){ $("#peso").innerHTML = ""; return; }
  const em = dias => {
    const lim = ms[n-1].ts - dias*86400;
    let c = 0; for(const m of ms) if(m.ts <= lim) c++;
    return c ? Math.round(100*(c-1)/(n-1)) : null;
  };
  const marcas = [["2 semanas",14],["1 mês",30],["3 meses",91],["6 meses",182],["1 ano",365],["2 anos",730]]
    .map(([t,d]) => [t, em(d)]).filter(([,v]) => v != null);
  $("#peso").innerHTML = `Peso de cada partida${S.seasons.size ? ` (só <b>${seasonLabel()}</b>, refeito dentro do recorte)` : ""}: a mais recente deste lobby
    (${fdata(ms[n-1].ts)}) vale <b>100%</b>, a primeira (${fdata(ms[0].ts)}) vale <b>0%</b>,
    e as ${(n-2).toLocaleString("pt-BR")} do meio sobem em partes iguais
    (<b>${(100/(n-1)).toFixed(3).replace(".",",")}%</b> por partida). Contando da última: ` +
    marcas.map(([t,v]) => `${t} antes <b>${v}%</b>`).join(" · ") + ".";
}

function draw(){
  const r = rank([...S.sel]);
  S.last = r;
  const maps = r.maps;

  $("#m-n").textContent = r.total.toLocaleString("pt-BR");
  $("#m-base").textContent = pc(r.thetaG);
  $("#lobby-n").textContent = (S.sel.size ? S.sel.size + " no lobby" : "ninguém marcado")
    + (S.seasons.size ? " · " + seasonLabel() : "");
  const sel = SEASONS.filter(s => S.seasons.has(s.n));
  $("#season-info").textContent = sel.length === 1 ? seasonRange(sel[0])
    : sel.map(s => "S" + s.n + ": " + seasonRange(s)).join(" · ");
  const vv = r.ms.filter(m=>m.outcome===1).length, dd = r.ms.filter(m=>m.outcome===0).length;
  $("#m-wl").textContent = `${vv}–${dd}`;
  drawPeso(r);

  const box = $("#rows");
  box.innerHTML = "";
  if(!maps.length){
    box.innerHTML = S.sel.size && S.seasons.size
      ? `<div class="vazio">Ninguém deste lobby jogou Premier ${S.seasons.size > 1 ? "nas" : "na"} ${seasonLabel()}.</div>`
      : `<div class="vazio">Marque pelo menos uma pessoa no lobby para ver a ordem de pick.</div>`;
    $("#ban").innerHTML = "";
    $("#verdict").innerHTML = "";
    $("#foot").innerHTML = rodape();
    drawTable(r);
    return;
  }

  maps.forEach((m,i) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "row" + (i===0?" top":"");
    btn.setAttribute("aria-expanded", S.open===m.map ? "true":"false");
    const col = colorFor(m.p);
    const z = m.Zraw==null ? "—" : sg(m.Zraw);
    btn.innerHTML = `
      <span class="pos">${i+1}</span>
      <span class="mp">${pretty(m.map)}</span>
      <span class="bar">
        <span class="fill" style="width:${(m.p*100).toFixed(1)}%;background:${col};opacity:.8"></span>
        <span class="ci" style="left:${(m.low*100).toFixed(1)}%;width:${((m.high-m.low)*100).toFixed(1)}%"></span>
        <span class="mid50"></span>
      </span>
      <span class="pct" style="color:${col}">${(m.p*100).toFixed(1)}%</span>
      <span class="side">
        <span class="conf c-${m.conf==="sem dados"?"sem":m.conf}">${m.conf==="media"?"média":m.conf}</span>
        <span class="nn">vit. ${m.winW==null?"—":pc(m.winW)} · K/D ${z}</span>
      </span>`;
    btn.addEventListener("click", () => { S.open = S.open===m.map ? null : m.map; draw(); });
    box.appendChild(btn);
    if(S.open===m.map) box.appendChild(detail(m));
  });

  // veredito honesto sobre a precisao do proprio ranking
  const sig = r.sig;
  const forte = sig.p < 0.05;
  $("#verdict").innerHTML = `
    <div class="panel verdict ${forte?"ok":"warn"}">
      <div class="vt">${forte
        ? "As diferenças entre mapas são reais"
        : "Os mapas estão empatados dentro do ruído"}</div>
      <div class="vb">
        Testando o saldo de <b>${sig.rounds.toLocaleString("pt-BR")} rounds</b> contra a
        hipótese de que todos os mapas rendem igual:
        <b>χ² = ${sig.chi.toFixed(1)}</b> com ${sig.df} graus de liberdade,
        <b>p = ${sig.p.toFixed(2)}</b>.
        ${forte
          ? "Há estrutura de verdade aqui — a ordem abaixo carrega informação."
          : `Um p tão alto significa que a variação entre os mapas é o que o acaso
             produziria sozinho. A ordem abaixo é o melhor palpite possível com os
             dados que existem, mas <b>não é uma diferença demonstrável</b>: use-a
             como desempate, não como verdade. O Premier pareia por rating e o veto
             tende a cair em mapas neutros para os dois times — os dois efeitos
             empurram todo mapa para perto de 50%.`}
      </div>
    </div>`;

  const pior = maps[maps.length-1];
  $("#ban").innerHTML =
    `<span class="lab">Banir primeiro</span>
     <span class="mapx">${pretty(pior.map)}</span>
     <span>${pc(pior.p)} esperado · ${pior.wTot}V-${pior.lTot}D no histórico</span>`;

  drawTable(r);
  $("#foot").innerHTML = rodape();
}

/* Relevancia de cada partida, no estilo da HLTV: idade x lineup, com a
   partida mais relevante do recorte = 100%. E exatamente o peso que ela tem
   na media do mapa com este time (antes do encolhimento). */
function drawTable(r){
  const sel = $("#tmap"), tb = $("#tbl"), tf = $("#tfoot");
  const maps = r.maps ? r.maps.map(m=>m.map) : [];
  const alvo = S.open || S.tmap;
  sel.innerHTML = `<option value="">Todos os mapas</option>` +
    maps.map(m=>`<option value="${m}" ${m===alvo?"selected":""}>${pretty(m)}</option>`).join("");
  if(!r.ms || !r.ms.length){ tb.innerHTML=""; tf.innerHTML=""; $("#tlead").innerHTML=""; return; }
  const pool = new Set(maps);
  const lista = r.ms.filter(m => pool.has(m.map) && (!alvo || m.map===alvo)).map(m => {
    let inter = 0; for(const x of m.roster) if(r.lobby.has(x)) inter++;
    return { m, inter };
  }).sort((a,b)=> b.m.w-a.m.w || b.m.ts-a.m.ts);
  const max = lista.length && lista[0].m.w > 0 ? lista[0].m.w : 1;
  const soma = lista.reduce((s,x)=>s+x.m.w,0) || 1;
  const top = lista.slice(0, S.tall ? lista.length : 25);
  let acum = 0; for(const x of top) acum += x.m.w;

  const lw = j => Math.round(100*(P.rosterFloor + (1-P.rosterFloor)*Math.pow(j, P.rosterGamma)));
  $("#tlead").innerHTML = `Relevância = <b>idade</b> × <b>lineup</b>, e a partida mais
    relevante ${alvo?"de "+pretty(alvo):"do recorte"} vira 100%.
    <b>Idade</b> é linear na ordem das partidas (a última vale 100%, a primeira 0%).
    <b>Lineup</b> = quantos do lobby estavam no seu time; <b>+N</b> = outros do grupo junto,
    o que também torna o time diferente (com 2 no lobby: 2/2 exato = 100%, 2/2 +1 = ${lw(2/3)}%,
    1/2 = ${lw(1/2)}%, 0/2 = ${lw(0)}%).
    <b>K/D</b> = desempenho de quem está no lobby naquela partida, em pontos acima ou abaixo
    do nível que cada um tinha nas ${P.trail} partidas anteriores.
    ${S.open?"":"Abra um mapa no ranking para ver só as partidas dele."}`;
  tb.innerHTML = `<thead><tr>
      <th>Res.</th><th>Data</th><th>Mapa</th><th class="r">Lineup</th><th class="r">K/D</th>
      <th class="r hm">× Idade</th><th class="r hm">× Lineup</th>
      <th class="r">Relevância</th></tr></thead><tbody>` +
    top.map(({m,inter}) => {
      const res = m.outcome===1?"v":m.outcome===0?"d":"";
      const rel = m.w/max*100;
      const extra = m.roster.size - inter;
      const kd = m.D==null ? "—" : `<span class="${m.D>=0?"up":"dn"}">${sg(m.D)}</span>`;
      return `<tr>
        <td class="res ${res}">${res==="v"?"V":res==="d"?"D":"E"} ${m.rw}–${m.rl}</td>
        <td>${fdata(m.ts)}</td><td class="mpn">${pretty(m.map)}</td>
        <td class="r">${inter}/${r.lobby.size}${extra?` <span title="outros do grupo no mesmo time">+${extra}</span>`:""}</td>
        <td class="r">${kd}</td>
        <td class="r hm">${(m.wIdade*100).toFixed(1)}%</td>
        <td class="r hm">${Math.round(m.wLine*100)}%</td>
        <td class="r"><span class="relv"><span class="relbar"><i style="width:${rel.toFixed(1)}%"></i></span>
          <b>${rel>=10?rel.toFixed(1):rel.toFixed(2)}%</b></span></td></tr>`;
    }).join("") + `</tbody>`;
  tf.innerHTML = `<span>${top.length} de ${lista.length} partidas · essas somam
      <b>${Math.round(acum/soma*100)}%</b> do peso total${alvo?" do mapa":""}</span>` +
    (lista.length > 25 ? `<button type="button" id="tall">${S.tall?"mostrar só as 25 primeiras":"mostrar todas"}</button>` : "");
  const b = $("#tall"); if(b) b.addEventListener("click", () => { S.tall = !S.tall; drawTable(r); });
}

function rodape(){
  const nPrem = ROWS.filter(r=>r.premier).length;
  const nomes = PLAYERS.filter(p=>S.sel.has(p.id)).map(p=>p.nome).join(" + ") || "ninguém";
  return `Histórico dos ${PLAYERS.length} no CSStats: <b>${ROWS.length.toLocaleString("pt-BR")}</b>
     partidas distintas, de ${fdata(ROWS[0].ts)} a ${fdata(ROWS[ROWS.length-1].ts)}, já sem
     abandonos e partidas interrompidas. Só as <b>${nPrem.toLocaleString("pt-BR")} de Premier</b>
     entram na conta: no Competitivo o mapa vem da fila, sem veto.
     ${S.seasons.size ? `<br>Filtro: <b>${seasonLabel()}</b> (${SEASONS.filter(s=>S.seasons.has(s.n)).map(seasonRange).join("; ")}).
       Só as partidas ${S.seasons.size > 1 ? "dessas seasons" : "dessa season"} entram, o peso 100%→0% é
       refeito dentro do recorte (a mais antiga dele 0%, a mais recente 100%) e os mapas
       listados são os que o lobby jogou nele. Só a conversão de K/D para % continua medida no histórico inteiro, porque
       uma season sozinha tem partidas de menos para essa conta.` : ""}
     <br>Lobby atual: <b>${nomes}</b>. Entram todas as partidas de Premier de quem está marcado,
     juntos ou separados; o placar é virado para o lado deles e cada partida é pesada pela
     idade e pela semelhança do time com o lobby.
     <br>A % de cada mapa é <b>metade vitória, metade K/D</b>. Vitória = taxa de vitória
     ponderada (com o saldo de rounds). K/D = índice de 0 a 99 de cada jogador do lobby em
     cada partida (K/D 37,5%, ADR 37,5%, rating 25%), comparado com o nível dele nas
     ${P.trail} partidas anteriores (o nível de cada um muda com o tempo); a conversão de
     pontos de K/D para % de vitória sai do próprio histórico do lobby.
     Nada disso é escolhido na página.`;
}

function detail(m){
  const d = document.createElement("div");
  d.className = "det";
  const notas = [];
  if(m.conf==="sem dados") notas.push("Quase sem histórico com esse time aqui — o número é basicamente a média do lobby.");
  else if(m.conf==="baixa") notas.push("Amostra fina, intervalo largo. Trate como palpite.");
  else if(m.conf==="alta") notas.push("Amostra sólida para esse time.");
  else notas.push("Amostra razoável.");
  const gap = (m.thetaR - m.pKD) * 100;
  if(Math.abs(gap) >= 4)
    notas.push(gap > 0
      ? `Vocês ganham aqui <b>mais</b> do que o K/D explica (${sg(gap)} pp): parte disso pode ser sorte.`
      : `O K/D aqui é <b>melhor</b> do que os resultados (${sg(gap)} pp): vocês jogam bem e perdem mais do que deveriam.`);
  if(m.Zraw != null && Math.abs(m.Zraw) >= 2)
    notas.push(`Desempenho do lobby aqui: <b>${sg(m.Zraw)} pontos</b> ${m.Zraw>0?"acima":"abaixo"} do nível de cada um na época.`);

  d.innerHTML = `<div class="dgrid">
    <div>
      <h3>Como chega nesse número</h3>
      <div class="kv"><span>Base do lobby</span><b>${pc(m.thetaG)}</b></div>
      <div class="kv"><span>Pelas vitórias aqui</span><b>${pc(m.thetaR)}</b></div>
      <div class="kv"><span>Pelo K/D aqui (${m.Zraw==null?"sem stats":sg(m.Zraw)+" pts"})</span><b>${pc(m.pKD)}</b></div>
      <div class="kv sum"><span>Previsão (metade de cada)</span><b>${pc(m.p)}</b></div>
    </div>
    <div>
      <h3>Amostra</h3>
      <div class="kv"><span>Intervalo 90%</span><b>${pc(m.low)} – ${pc(m.high)}</b></div>
      <div class="kv"><span>Amostra efetiva</span><b>${m.nEff.toFixed(1)}</b></div>
      <div class="kv"><span>Partidas no mapa</span><b>${m.games}</b></div>
      <div class="kv"><span>Placar bruto</span><b>${m.wTot}V – ${m.lTot}D</b></div>
      <div class="kv"><span>Com este time exato</span><b>${m.exW}V – ${m.exL}D</b></div>
    </div>
    <div>
      <h3>Leitura</h3>
      <div class="note">${notas.join(" ")}
        <br><span style="font-size:12px">Neste lobby, jogar 1 ponto de K/D acima da média vale
        <b>${sg(m.slope*100)} pp</b> de vitória (medido no histórico).</span></div>
    </div>
  </div>`;
  return d;
}

/* eventos */
$("#tmap").addEventListener("change", e => { S.tmap = e.target.value; S.open = null; S.tall = false; draw(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);

S.sel.add(PLAYERS[0].id); S.sel.add(PLAYERS[1].id);  // abre no uso tipico
buildMates();
buildSeasons();

const fmt = ts => new Date(ts*1000).toLocaleDateString("pt-BR",{month:"short",year:"numeric"});
$("#sub").textContent = `${PLAYERS[0].nome} + ${PLAYERS.length-1} · CSStats · ${fmt(ROWS[0].ts)} – ${fmt(ROWS[ROWS.length-1].ts)}`;

draw();
</script>
