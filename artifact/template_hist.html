<title>Mappick CS2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg:#eef1f4; --surface:#ffffff; --surface-2:#e4e9ee; --sunken:#dde3e9;
    --line:#ccd5dd; --line-soft:#dfe5eb;
    --fg:#141d27; --fg-dim:#54677a; --fg-faint:#8394a3;
    --accent:#2f6fb5; --accent-soft:#dce8f5; --bar:#5d86b3; --bar-thin:#aab8c6;
    --warn:#b57b16; --warn-soft:#f6ecd9;
    --shadow:0 1px 2px rgba(20,29,39,.07), 0 4px 14px rgba(20,29,39,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0d1218; --surface:#151d26; --surface-2:#1c2531; --sunken:#0a0e13;
      --line:#2a3541; --line-soft:#222c37;
      --fg:#e3ebf2; --fg-dim:#94a5b4; --fg-faint:#64757f;
      --accent:#5b9be0; --accent-soft:#1a2c40; --bar:#4f7fb3; --bar-thin:#3a4a5a;
      --warn:#d9a441; --warn-soft:#2a2214;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --bg:#0d1218; --surface:#151d26; --surface-2:#1c2531; --sunken:#0a0e13;
    --line:#2a3541; --line-soft:#222c37;
    --fg:#e3ebf2; --fg-dim:#94a5b4; --fg-faint:#64757f;
    --accent:#5b9be0; --accent-soft:#1a2c40; --bar:#4f7fb3; --bar-thin:#3a4a5a;
    --warn:#d9a441; --warn-soft:#2a2214;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font-family:"Barlow",system-ui,-apple-system,sans-serif; font-size:15px; line-height:1.5;
         -webkit-font-smoothing:antialiased; }
  .wrap { max-width:940px; margin:0 auto; padding-inline:16px; padding-block:22px 56px; }

  header { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:20px; }
  h1 { font-family:"Barlow Condensed",system-ui,sans-serif; font-weight:700; font-size:30px;
       letter-spacing:.4px; text-transform:uppercase; margin:0; line-height:1; }
  .sub { color:var(--fg-faint); font-size:13px; margin-top:4px; }
  .meta { display:flex; gap:22px; flex-wrap:wrap; }
  .meta div { text-align:right; }
  .k { font-family:"Barlow Condensed",sans-serif; font-size:11px; letter-spacing:.8px;
       text-transform:uppercase; color:var(--fg-faint); font-weight:600; }
  .meta .v { font-size:17px; font-weight:600; font-variant-numeric:tabular-nums; }

  .panel { background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); }
  .panel + .panel, .panel + #verdict, #verdict + .panel { margin-top:14px; }
  .phead { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
           padding:13px 16px; border-bottom:1px solid var(--line-soft); }
  h2 { font-family:"Barlow Condensed",sans-serif; font-weight:600; font-size:14px; letter-spacing:1px;
       text-transform:uppercase; margin:0; color:var(--fg-dim); }
  .pbody { padding:14px 16px; }
  .nn { font-size:11px; color:var(--fg-faint); font-variant-numeric:tabular-nums; }

  .mates { display:flex; flex-wrap:wrap; gap:8px; }
  .mate { display:inline-flex; align-items:center; gap:8px; cursor:pointer; user-select:none;
          background:var(--surface-2); border:1px solid var(--line); border-radius:7px; padding:7px 12px;
          transition:background .12s, border-color .12s; }
  .mate:hover { border-color:var(--fg-faint); }
  .mate:focus-within { outline:2px solid var(--accent); outline-offset:2px; }
  .mate input { accent-color:var(--accent); margin:0; cursor:pointer; }
  .mate.on { background:var(--accent-soft); border-color:var(--accent); }
  .mate .nm { font-weight:600; font-size:14px; }
  .mate .gm { font-size:11px; color:var(--fg-faint); font-variant-numeric:tabular-nums; }

  .ctl { display:flex; gap:18px; align-items:center; flex-wrap:wrap; margin-top:14px;
         padding-top:13px; border-top:1px solid var(--line-soft); }
  .ctl label.t { font-size:12px; color:var(--fg-dim); display:flex; align-items:center; gap:7px; cursor:pointer; }
  .grp { display:flex; align-items:center; gap:7px; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .seg button { font-family:inherit; font-size:12px; padding:4px 10px; border:0; cursor:pointer;
                background:var(--surface-2); color:var(--fg-dim); border-right:1px solid var(--line); }
  .seg button:last-child { border-right:0; }
  .seg button[aria-pressed="true"] { background:var(--accent); color:#fff; font-weight:600; }
  .seg button:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }

  /* veredito */
  .verdict { padding:15px 16px; border-left:3px solid var(--warn); }
  .verdict .vt { font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:17px;
                 letter-spacing:.4px; text-transform:uppercase; color:var(--warn); margin-bottom:6px; }
  .verdict p { font-size:13.5px; color:var(--fg-dim); line-height:1.6; margin:0 0 8px; max-width:70ch; }
  .verdict p:last-child { margin-bottom:0; }
  .verdict b { color:var(--fg); }
  .nums { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:10px 0 12px; }
  .num { background:var(--surface-2); border-radius:7px; padding:9px 11px; }
  .num .v { font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.1; }
  .num .d { font-size:11.5px; color:var(--fg-faint); margin-top:3px; line-height:1.35; }

  /* historico */
  .rows { display:flex; flex-direction:column; }
  .row { display:grid; grid-template-columns:104px 1fr 62px 92px; align-items:center; gap:12px;
         padding:10px 16px; cursor:pointer; border:0; border-bottom:1px solid var(--line-soft);
         background:none; width:100%; text-align:left; font:inherit; color:inherit; }
  .row:last-child { border-bottom:0; }
  .row:hover { background:var(--surface-2); }
  .row:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
  .mp { font-family:"Barlow Condensed",sans-serif; font-weight:600; font-size:17px; letter-spacing:.3px; }
  .bar { position:relative; height:18px; background:var(--sunken); border-radius:4px; overflow:hidden; }
  .fill { position:absolute; inset:0 auto 0 0; background:var(--bar); border-radius:4px; }
  .fill.thin { background:var(--bar-thin); }
  .ci { position:absolute; top:50%; transform:translateY(-50%); height:9px;
        border-left:2px solid var(--fg-dim); border-right:2px solid var(--fg-dim); }
  .ci::before { content:""; position:absolute; top:50%; left:0; right:0; height:1px;
                transform:translateY(-50%); background:var(--fg-dim); opacity:.6; }
  .mid50 { position:absolute; top:0; bottom:0; left:50%; border-left:1px dashed var(--fg-faint); opacity:.6; }
  .pct { text-align:right; font-weight:700; font-size:16px; font-variant-numeric:tabular-nums; }
  .pct.thin { color:var(--fg-faint); font-weight:600; }
  .wl { text-align:right; font-size:12px; color:var(--fg-dim); font-variant-numeric:tabular-nums; }
  .wl small { display:block; font-size:10.5px; color:var(--fg-faint); }

  .det { padding:4px 16px 16px; background:var(--surface-2); border-bottom:1px solid var(--line-soft); }
  .dgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:16px; padding-top:12px; }
  .dgrid h3 { font-family:"Barlow Condensed",sans-serif; font-size:11px; letter-spacing:.9px;
              text-transform:uppercase; color:var(--fg-faint); margin:0 0 6px; font-weight:600; }
  .kv { display:flex; justify-content:space-between; gap:12px; font-size:13px; color:var(--fg-dim); padding:2px 0; }
  .kv b { color:var(--fg); font-weight:600; font-variant-numeric:tabular-nums; }
  .ult { display:flex; gap:3px; flex-wrap:wrap; margin-top:4px; }
  .ult span { width:18px; height:18px; border-radius:3px; font-size:10px; font-weight:700;
              display:inline-flex; align-items:center; justify-content:center; background:var(--sunken); color:var(--fg-dim); }
  .ult span.v { background:var(--accent-soft); color:var(--accent); }

  .vazio { padding:26px 16px; text-align:center; color:var(--fg-faint); font-size:14px; }
  footer { margin-top:18px; font-size:12px; color:var(--fg-faint); line-height:1.7; max-width:80ch; }
  footer b { color:var(--fg-dim); }

  @media (max-width:640px) {
    .row { grid-template-columns:78px 1fr 52px; gap:9px; padding-inline:12px; }
    .wl { display:none; }
    h1 { font-size:25px; }
    .meta { gap:14px; }
  }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Mappick</h1>
      <div class="sub" id="sub">—</div>
    </div>
    <div class="meta">
      <div><div class="k">Partidas juntos</div><div class="v" id="m-n">—</div></div>
      <div><div class="k">V–D</div><div class="v" id="m-wl">—</div></div>
      <div><div class="k">Chance da formação</div><div class="v" id="m-base">—</div></div>
    </div>
  </header>

  <section class="panel">
    <div class="phead"><h2>Quem está no lobby</h2><span class="nn" id="lobby-n"></span></div>
    <div class="pbody">
      <div class="mates" id="mates"></div>
      <div class="ctl">
        <div class="grp"><span class="k">Período</span>
          <div class="seg" id="seg-per">
            <button type="button" data-d="182">6 meses</button>
            <button type="button" data-d="365">1 ano</button>
            <button type="button" data-d="99999" aria-pressed="true">tudo</button>
          </div></div>
        <div class="grp"><span class="k">Ordenar</span>
          <div class="seg" id="seg-ord">
            <button type="button" data-o="n" aria-pressed="true">mais jogados</button>
            <button type="button" data-o="wr">winrate</button>
          </div></div>
        <label class="t"><input type="checkbox" id="prem" autocomplete="off" checked> só Premier</label>
      </div>
    </div>
  </section>

  <div id="verdict"></div>

  <section class="panel">
    <div class="phead"><h2>Histórico desta formação por mapa</h2>
      <span class="nn">barra = winrate · marcas = intervalo 90% · tracejado = 50%</span></div>
    <div class="rows" id="rows"></div>
  </section>

  <footer id="foot"></footer>
</div>

<script>
const RAW = __RAW__;
const MAPS = __MAPS__;
const PLAYERS = __PLAYERS__;
const TESTE = __TESTE__;
const EU = PLAYERS[0].id;
const EPOCH = 1690000000;
const NOW = Date.now() / 1000;

/* Parametros escolhidos por calibracao (ajuste nas partidas antigas, validacao
   nas recentes). O peso otimo do mapa saiu ZERO, por isso a chance da formacao
   e a mesma em qualquer mapa. So a base do lobby sobreviveu ao teste. */
const OBJ = { halfLife: 240, kGlobal: 80 };

const ROWS = RAW.trim().split("\n").map(line => {
  const p = line.split(",");
  const ts = +p[0]*60 + EPOCH;
  return { ts, map: MAPS[+p[1]], a: +p[2], b: +p[3], teams: p[4], premier: p[5] === "1",
    k: p[6]!=="" && p[6]!=null ? +p[6] : null, d: p[7] ? +p[7] : null,
    adr: p[9] ? +p[9] : null, rating: p[11] ? parseFloat(p[11]) : null,
    age: (NOW - ts) / 86400 };
});
PLAYERS.forEach((p,i) => {
  p.jogos = ROWS.filter(r => r.teams[i] !== "-").length;
  // nicks feitos so de simbolos que a fonte nao desenha viram chip vazio;
  // o final do Steam ID deixa a pessoa reconhecivel
  p.rotulo = /[A-Za-z0-9À-ÿ]/.test(p.nome) ? p.nome : `${p.nome} …${p.id.slice(-4)}`;
});

const S = { sel: new Set([PLAYERS[0].id, PLAYERS[1].id]), per: 99999, ord: "n", prem: true, open: null };
const $ = s => document.querySelector(s);
const pretty = m => m.replace(/^(de|cs)_/,"").replace(/^./,c=>c.toUpperCase());
const pc = x => (x*100).toFixed(1) + "%";
const idx = id => PLAYERS.findIndex(p => p.id === id);

/* partida em que TODOS os marcados jogaram, do mesmo lado; devolve o lado */
function ladoJuntos(r, lobby){
  let side = null;
  for(const id of lobby){
    const ch = r.teams[idx(id)];
    if(ch === "-") return null;
    if(side && side !== ch) return null;
    side = ch;
  }
  return side;
}
function orienta(r, side){
  const rw = side==="1" ? r.a : r.b, rl = side==="1" ? r.b : r.a;
  return { rw, rl, y: rw>rl ? 1 : (rl>rw ? 0 : 0.5) };
}

/* intervalo de Wilson, 90% */
function wilson(w, n, z=1.645){
  if(!n) return [0,1];
  const p = w/n, den = 1 + z*z/n, c = p + z*z/(2*n);
  const m = z*Math.sqrt(p*(1-p)/n + z*z/(4*n*n));
  return [Math.max(0,(c-m)/den), Math.min(1,(c+m)/den)];
}

/* chance objetiva da formacao: base do lobby, encolhida para 50% (calibrada) */
function chanceFormacao(jogos){
  if(!jogos.length) return 0.5;
  const pts = jogos.map(j => ({ w: Math.pow(2, -j.r.age/OBJ.halfLife),
                                q: (j.o.rw + j.o.rl) ? j.o.rw/(j.o.rw + j.o.rl) : 0.5, y: j.o.y }));
  // calibra round share -> escala de vitoria
  const m1 = pts.filter(p=>p.y===1), m0 = pts.filter(p=>p.y===0);
  const avg = a => a.reduce((s,p)=>s+p.q*p.w,0) / (a.reduce((s,p)=>s+p.w,0)||1);
  let q1 = m1.length ? avg(m1) : 1, q0 = m0.length ? avg(m0) : 0;
  const ok = m1.length && m0.length && (q1-q0) > 0.05;
  let sw=0, sq=0, s2=0;
  for(const p of pts){
    const q = ok ? Math.min(Math.max((p.q-q0)/(q1-q0),-0.2),1.2) : p.y;
    sw += p.w; sq += p.w*q; s2 += p.w*p.w;
  }
  const n = sw*sw/s2, mean = sq/sw;
  return (n*mean + OBJ.kGlobal*0.5) / (n + OBJ.kGlobal);
}

function coletar(){
  const out = [];
  if(!S.sel.size) return out;
  for(const r of ROWS){
    if(S.prem && !r.premier) continue;
    if(r.age > S.per) continue;
    const side = ladoJuntos(r, S.sel);
    if(!side) continue;
    out.push({ r, side, o: orienta(r, side), euNoLado: r.teams[0] === side });
  }
  return out;
}

function buildMates(){
  const box = $("#mates"); box.innerHTML = "";
  for(const p of PLAYERS){
    const l = document.createElement("label");
    l.className = "mate" + (S.sel.has(p.id) ? " on" : "");
    l.innerHTML = `<input type="checkbox" autocomplete="off" id="m-${p.id}" ${S.sel.has(p.id)?"checked":""}>
      <span class="nm">${p.id===EU ? "◈ " : ""}${p.rotulo}</span><span class="gm">${p.jogos}j</span>`;
    l.querySelector("input").addEventListener("change", e => {
      e.target.checked ? S.sel.add(p.id) : S.sel.delete(p.id);
      l.classList.toggle("on", e.target.checked); S.open = null; draw();
    });
    box.appendChild(l);
  }
}

function draw(){
  const jogos = coletar();
  const v = jogos.filter(j=>j.o.y===1).length, d = jogos.filter(j=>j.o.y===0).length;
  $("#m-n").textContent = jogos.length;
  $("#m-wl").textContent = `${v}–${d}`;
  $("#m-base").textContent = jogos.length ? pc(chanceFormacao(jogos)) : "—";
  $("#lobby-n").textContent = S.sel.size ? `${S.sel.size} marcado${S.sel.size>1?"s":""}` : "ninguém marcado";

  drawVerdict(jogos);

  const box = $("#rows"); box.innerHTML = "";
  if(!S.sel.size){ box.innerHTML = `<div class="vazio">Marque pelo menos uma pessoa.</div>`; foot(); return; }
  if(!jogos.length){ box.innerHTML = `<div class="vazio">Essa formação nunca jogou junta${S.per<99999?" nesse período":""}.</div>`; foot(); return; }

  const por = {};
  for(const j of jogos){ (por[j.r.map] ||= []).push(j); }
  let lista = Object.entries(por).map(([map, js]) => {
    const w = js.filter(j=>j.o.y===1).length, l = js.filter(j=>j.o.y===0).length;
    const dr = js.length - w - l, n = js.length;
    const wr = (w + 0.5*dr)/n;
    return { map, js, n, w, l, dr, wr, ci: wilson(w + 0.5*dr, n) };
  });
  lista.sort(S.ord==="wr" ? (a,b)=> b.wr-a.wr || b.n-a.n : (a,b)=> b.n-a.n || b.wr-a.wr);

  for(const m of lista){
    const fino = m.n < 10;
    const btn = document.createElement("button");
    btn.type = "button"; btn.className = "row";
    btn.setAttribute("aria-expanded", S.open===m.map ? "true" : "false");
    btn.innerHTML = `
      <span class="mp">${pretty(m.map)}</span>
      <span class="bar">
        <span class="fill${fino?" thin":""}" style="width:${(m.wr*100).toFixed(1)}%"></span>
        <span class="ci" style="left:${(m.ci[0]*100).toFixed(1)}%;width:${((m.ci[1]-m.ci[0])*100).toFixed(1)}%"></span>
        <span class="mid50"></span>
      </span>
      <span class="pct${fino?" thin":""}">${pc(m.wr)}</span>
      <span class="wl">${m.w}V–${m.l}D${m.dr?` ${m.dr}E`:""}<small>${m.n} partida${m.n>1?"s":""}${fino?" · pouca amostra":""}</small></span>`;
    btn.addEventListener("click", () => { S.open = S.open===m.map ? null : m.map; draw(); });
    box.appendChild(btn);
    if(S.open===m.map) box.appendChild(detalhe(m));
  }
  foot();
}

function detalhe(m){
  const d = document.createElement("div"); d.className = "det";
  const rw = m.js.reduce((s,j)=>s+j.o.rw,0), rl = m.js.reduce((s,j)=>s+j.o.rl,0);
  const ult = [...m.js].sort((a,b)=>b.r.ts-a.r.ts).slice(0,12);
  const fmt = t => new Date(t*1000).toLocaleDateString("pt-BR",{day:"2-digit",month:"short",year:"2-digit"});
  let meu = "";
  if(S.sel.has(EU)){
    const st = m.js.filter(j=>j.euNoLado && j.r.k!=null);
    if(st.length){
      const k = st.reduce((s,j)=>s+j.r.k,0), dd = st.reduce((s,j)=>s+j.r.d,0);
      const adr = st.reduce((s,j)=>s+j.r.adr,0)/st.length;
      const rt = st.filter(j=>j.r.rating!=null);
      meu = `<div><h3>Seu rendimento neste mapa</h3>
        <div class="kv"><span>K/D</span><b>${(k/Math.max(dd,1)).toFixed(2)}</b></div>
        <div class="kv"><span>ADR</span><b>${adr.toFixed(1)}</b></div>
        ${rt.length?`<div class="kv"><span>Rating</span><b>${(rt.reduce((s,j)=>s+j.r.rating,0)/rt.length).toFixed(2)}</b></div>`:""}
        <div class="kv"><span>Partidas com stats</span><b>${st.length}</b></div></div>`;
    }
  }
  d.innerHTML = `<div class="dgrid">
    <div><h3>Retrospecto</h3>
      <div class="kv"><span>Winrate</span><b>${pc(m.wr)}</b></div>
      <div class="kv"><span>Intervalo 90%</span><b>${pc(m.ci[0])} – ${pc(m.ci[1])}</b></div>
      <div class="kv"><span>Rounds</span><b>${rw}–${rl} (${pc(rw/(rw+rl))})</b></div>
      <div class="kv"><span>Última vez</span><b>${fmt(ult[0].r.ts)}</b></div></div>
    <div><h3>Últimas ${ult.length} (mais recente à esquerda)</h3>
      <div class="ult">${ult.map(j=>`<span class="${j.o.y===1?"v":""}" title="${fmt(j.r.ts)} · ${j.o.rw}x${j.o.rl}">${j.o.y===1?"V":(j.o.y===0?"D":"E")}</span>`).join("")}</div></div>
    ${meu}
  </div>`;
  return d;
}

function drawVerdict(jogos){
  $("#verdict").innerHTML = `<section class="panel verdict">
    <div class="vt">O mapa não prevê o resultado de vocês</div>
    <p>Testei se escolher o mapa pelo histórico faz vocês ganharem mais. Em
      <b>${TESTE.n.toLocaleString("pt-BR")} partidas Premier</b>, cada uma prevista usando só o que
      tinha acontecido antes dela:</p>
    <div class="nums">
      <div class="num"><div class="v">${TESTE.topo.toFixed(1)}%</div>
        <div class="d">vitória quando o mapa jogado era o que o histórico mais recomendava</div></div>
      <div class="num"><div class="v">${TESTE.fundo.toFixed(1)}%</div>
        <div class="d">vitória quando era o que o histórico menos recomendava</div></div>
      <div class="num"><div class="v">p = ${TESTE.p.toFixed(2)}</div>
        <div class="d">diferença compatível com acaso (${TESTE.dif>0?"+":""}${TESTE.dif.toFixed(1)} pp)</div></div>
    </div>
    <p>Quando o mesmo teste pode "espiar" o resultado, ele acusa <b>+${TESTE.controle.toFixed(0)} pp</b> —
      então o teste funciona; é o histórico por mapa que não carrega sinal. Calibrando os pesos de forma
      objetiva, o peso ótimo do mapa saiu <b>zero</b>: a chance desta formação é
      <b>${jogos.length ? pc(chanceFormacao(jogos)) : "—"}</b> em qualquer mapa.</p>
    <p>O retrospecto abaixo é real e vale como memória — só não use como previsão. Escolham pelo
      conforto do time.</p>
  </section>`;
}

function foot(){
  const nP = ROWS.filter(r=>r.premier).length;
  $("#foot").innerHTML =
    `Base: <b>${ROWS.length.toLocaleString("pt-BR")}</b> partidas distintas dos ${PLAYERS.length} jogadores no
     CSStats (${nP.toLocaleString("pt-BR")} de Premier), sem abandonos nem partidas interrompidas.
     O histórico conta só as partidas em que <b>todos os marcados</b> jogaram juntos, do mesmo lado.
     <br>A "chance da formação" é o único número preditivo da página: base do lobby com peso que cai pela
     metade a cada ${OBJ.halfLife} dias, encolhida para 50% com ${OBJ.kGlobal} partidas fictícias — os dois
     valores escolhidos por calibração (ajuste nas partidas antigas, validação nas ${TESTE.nval} mais recentes).
     Os mapas com menos de 10 partidas aparecem em cinza.`;
}

/* eventos */
function seg(el, attr, key, conv){
  el.addEventListener("click", e => {
    const b = e.target.closest("button"); if(!b) return;
    S[key] = conv(b.dataset[attr]);
    [...el.children].forEach(x => x.setAttribute("aria-pressed", x===b ? "true":"false"));
    S.open = null; draw();
  });
}
seg($("#seg-per"), "d", "per", Number);
seg($("#seg-ord"), "o", "ord", String);
$("#prem").addEventListener("change", e => { S.prem = e.target.checked; S.open = null; draw(); });

const d0 = new Date(Math.min(...ROWS.map(r=>r.ts))*1000), d1 = new Date(Math.max(...ROWS.map(r=>r.ts))*1000);
const fmtm = d => d.toLocaleDateString("pt-BR",{month:"short",year:"numeric"});
$("#sub").textContent = `${PLAYERS.length} jogadores · CSStats · ${fmtm(d0)} – ${fmtm(d1)}`;
buildMates();
draw();
</script>
